[project]
name = "revision-os"
version = "0.1.0"
description = "Transforme un cours audio en fiche, questions et cartes Anki — pipeline Python + serveur MCP pour agents (Claude, Cursor, OMP…)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Emil Galode" }]
keywords = ["anki", "flashcards", "transcription", "lecture-notes", "mcp", "fsrs", "study"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Education",
  "Intended Audience :: Education",
]
dependencies = [
  "httpx>=0.27",
  "mcp>=1.2",
  "genanki>=0.13",
  "pymupdf>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
revision-pipeline = "pipeline.cli:main"
revision-mcp = "revision_mcp.server:main"

[project.urls]
Homepage = "https://github.com/ewiwlll/revision-os"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "revision_mcp"]
